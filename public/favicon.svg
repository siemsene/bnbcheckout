<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Checkout Rush">
  <title>Checkout Rush</title>
  <!-- Badge, in the app's deep green. NB: no double hyphens in XML comments. -->
  <rect width="64" height="64" rx="15" fill="#2e4638"/>
  <!-- House: two bold shapes only, so it still reads as a house at 16px. -->
  <path d="M32 12 56 33H8Z" fill="#f6efe2"/>
  <path d="M14 33h36v17a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3z" fill="#f6efe2"/>
  <rect x="21" y="40" width="9" height="13" rx="2.5" fill="#2e4638"/>
  <!-- The 10 AM deadline. The dark ring keeps the clock separate from the
       house once the mark collapses to favicon size. -->
  <circle cx="47" cy="45" r="12.5" fill="#2e4638"/>
  <circle cx="47" cy="45" r="9.5" fill="#d9884a"/>
  <g stroke="#2e4638" stroke-width="2.4" stroke-linecap="round">
    <path d="M47 45V39.5"/>
    <path d="M47 45l-4 3"/>
  </g>
</svg>
